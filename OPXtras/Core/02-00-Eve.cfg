@Kopernicus:FOR[zOPXtras]
{
    @Body[Eve]
    {
        @Properties
        {
            @ScienceValues
            {
                %recoveryValue = 15
            }
        }
        @Properties:HAS[@OPXtras_Settings:HAS[#EveLongDay[True]]]
        {
            %rotationPeriod = -7087200
        }
        @Orbit:HAS[@OPXtras_Settings:HAS[#EveInclinationFix[True]]]
		{
			%inclination = 0.938
		}
    }
}
